[package]
name = "smtp-server"
description = "Inbound SMTP and submission listeners for Idly Mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Deliberately no dependency on any outbound (smtp-client) crate: the inbound
# server can only hand messages to a local Sink. See CLAUDE.md (no relays).
[dependencies]
smtp-proto.workspace = true
queue.workspace = true
dns.workspace = true
mail-auth-glue.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
dns = { workspace = true, features = ["testing"] }
argon2.workspace = true

[lints]
workspace = true
