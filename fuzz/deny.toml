# cargo-deny policy for the fuzz harness. Same as ../deny.toml, plus one
# exception: libfuzzer-sys bundles LLVM libFuzzer under the permissive NCSA
# license. The exception covers libfuzzer-sys only, and the fuzz crate is
# never linked into the shipped binary (see CLAUDE.md, "Fuzz crate notes").

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive licenses only. Copyleft (GPL, LGPL, AGPL, MPL, EPL, ...) is
# rejected because it is not listed here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Hard constraint 4: TLS via rustls only, never OpenSSL.
    { crate = "openssl", reason = "TLS must use rustls" },
    { crate = "openssl-sys", reason = "TLS must use rustls" },
    { crate = "native-tls", reason = "TLS must use rustls" },
    { crate = "tokio-native-tls", reason = "TLS must use rustls" },
    { crate = "hyper-tls", reason = "TLS must use rustls" },
    # Single crypto stack: ring (see CLAUDE.md). aws-lc carries the
    # OpenSSL license.
    { crate = "aws-lc-rs", reason = "use ring; aws-lc includes OpenSSL-licensed code" },
    { crate = "aws-lc-sys", reason = "use ring; aws-lc includes OpenSSL-licensed code" },
    # CDLA-Permissive-2.0 data license is not on the allow-list.
    { crate = "webpki-roots", reason = "use rustls-native-certs" },
    # Hard constraint 1: no relays, no third-party mail APIs.
    { crate = "lettre", reason = "ships smarthost/relay transports; we deliver direct to MX" },
    { crate = "sendgrid", reason = "third-party mail API" },
    { crate = "mailgun-rs", reason = "third-party mail API" },
    { crate = "aws-sdk-ses", reason = "third-party mail API" },
    { crate = "aws-sdk-sesv2", reason = "third-party mail API" },
    { crate = "rusoto_ses", reason = "third-party mail API" },
    # Hard constraint 2: no cloud SDKs. S3 goes through a generic client.
    { crate = "aws-config", reason = "cloud SDK" },
    { crate = "aws-types", reason = "cloud SDK" },
    { crate = "aws-sdk-s3", reason = "cloud SDK; use a generic S3 protocol client" },
    { crate = "rusoto_core", reason = "cloud SDK" },
    { crate = "azure_core", reason = "cloud SDK" },
    { crate = "azure_storage", reason = "cloud SDK" },
    { crate = "google-cloud-storage", reason = "cloud SDK" },
    { crate = "gcp_auth", reason = "cloud SDK" },
    # Hard constraint 2: spam AI is local (Ollama) only.
    { crate = "async-openai", reason = "cloud AI API" },
    { crate = "openai-api-rs", reason = "cloud AI API" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
