[package]
name = "smtp-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
smtp-proto = { path = "../crates/smtp-proto" }
mail-auth-glue = { path = "../crates/mail-auth-glue" }
dns = { path = "../crates/dns", features = ["testing"] }
smtp-server = { path = "../crates/smtp-server" }
tokio = { version = "1", default-features = false, features = ["rt", "time", "io-util", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

# Kept out of the main workspace: the fuzz harness is never linked into idly.
[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
# Overflow checks stay on so arithmetic bugs surface as crashes.
overflow-checks = true

[[bin]]
name = "command_parse"
path = "fuzz_targets/command_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reply_parse"
path = "fuzz_targets/reply_parse.rs"
test = false
doc = false
bench = false

[[bin]]
