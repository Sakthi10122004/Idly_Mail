[package]
name = "smtp-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
smtp-proto = { path = "../crates/smtp-proto" }
mail-auth-glue = { path = "../crates/mail-auth-glue" }
dns = { path = "../crates/dns", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

# Kept out of the main workspace: the fuzz harness is never linked into idly.
[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
# Overflow checks stay on so arithmetic bugs surface as crashes.
overflow-checks = true

[[bin]]
name = "command_parse"
path = "fuzz_targets/command_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reply_parse"
path = "fuzz_targets/reply_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_decode"
path = "fuzz_targets/data_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dkim_verify"
path = "fuzz_targets/dkim_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spf_record"
path = "fuzz_targets/spf_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dmarc_record"
path = "fuzz_targets/dmarc_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_results"
path = "fuzz_targets/auth_results.rs"
test = false
doc = false
bench = false
