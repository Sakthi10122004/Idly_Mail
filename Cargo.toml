[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
authors = ["The Idly Mail Contributors"]
publish = false

[workspace.dependencies]
smtp-proto = { path = "crates/smtp-proto" }
dns = { path = "crates/dns" }
smtp-server = { path = "crates/smtp-server" }
mail-auth-glue = { path = "crates/mail-auth-glue" }
queue = { path = "crates/queue" }
smtp-client = { path = "crates/smtp-client" }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
argon2 = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "fallible_uint"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
ring = { version = "0.17", default-features = false, features = ["std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# gzip for TLS reports (RFC 8460 §5.2); the pure-Rust miniz_oxide backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["recursor", "dnssec-ring", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs"] }
idna = { version = "1", default-features = false, features = ["std", "compiled_data"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }
prometheus-client = "0.25"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Hard constraint 4: no unsafe code anywhere in our crates.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Parsers of network input must not panic on hostile bytes.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# RSA key generation (rsa crate) is very slow without optimization; keep
# tests fast.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
