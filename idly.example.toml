# Idly Mail example configuration.
#
# Check a config file with:   idly --config /etc/idly/idly.toml check-config
#
# Unknown keys are errors. There is deliberately no relay or smarthost option:
# Idly delivers directly to each recipient domain's MX (see README.md).

[server]
# Fully qualified host name of this server. Used in the SMTP banner and EHLO;
# its A/AAAA records and the PTR of the public IPs should all match it.
hostname = "mx.example.org"
# Queue, spool, Maildir and keys live here.
data_dir = "/var/lib/idly"
# Public IP addresses, used to check PTR records. Leave empty to auto-detect.
public_ips = []
# Addresses outbound mail is sent from: at most one IPv4 and one IPv6. Each
# must be assigned to this server and have a PTR record naming `hostname`
# (checked at startup). When set, mail goes out only over the families
# listed. Leave empty to let the system choose (both families).
outbound_ips = []

[listen]
smtp = ["0.0.0.0:25", "[::]:25"]                 # inbound mail
submission = ["0.0.0.0:587", "[::]:587"]         # clients, STARTTLS + AUTH
submissions = ["0.0.0.0:465", "[::]:465"]        # clients, implicit TLS + AUTH
metrics = "127.0.0.1:9100"                       # Prometheus; keep on loopback

[limits]
command_line = 4096         # octets, CRLF included (RFC minimum: 512)
inbound_line = 65536        # octets per DATA line (RFC minimum: 1000)
message_size = 26214400     # 25 MiB, announced with SIZE
max_recipients = 100        # per message (RFC minimum: 100)
min_free_space = 1073741824 # refuse new mail (452 4.3.1) below 1 GiB free
command_timeout = 300       # seconds waiting for a command (RFC minimum: 300)
data_timeout = 300          # seconds waiting for message data
tls_handshake_timeout = 30  # seconds
session_timeout = 1800      # hard cap on one SMTP session, seconds
max_connections = 100       # simultaneous connections on port 25
max_submission_connections = 50  # on 587/465, a separate pool

# The TLS certificate for STARTTLS (25, 587), implicit TLS (465) and the
# MTA-STS policy (443) comes from ONE of these two sections. Without either,
# port 25 runs without STARTTLS and 587/465 are not started, because AUTH is
# never offered without TLS.
#
# 1. PEM files you manage yourself (e.g. with certbot). Changed files are
#    picked up within 5 minutes; no restart needed.
[tls]
cert_file = "/etc/idly/tls/fullchain.pem"
key_file = "/etc/idly/tls/privkey.pem"

# 2. Automatic certificates from an ACME CA (Let's Encrypt by default),
#    using HTTP-01 challenges on port 80. One certificate covers
#    server.hostname and, with [mta_sts], mta-sts.<domain> for every domain;
#    each name's A/AAAA record must point to this server. The key in
#    <data_dir>/acme/tls.key is kept across renewals, so a DANE TLSA record
#    ("3 1 1", see `idly dns`) stays valid. Until the first certificate
#    arrives, a self-signed one is served.
# [acme]
# directory = "letsencrypt"            # or "letsencrypt-staging", or an https:// URL
# contact = "postmaster@example.org"   # expiry and problem notices from the CA
# accept_terms = true                  # required: you accept the CA's terms of service
# listen = ["0.0.0.0:80", "[::]:80"]   # the CA connects to port 80

# MTA-STS (RFC 8461): tells other servers to deliver to this one only over
# validated TLS. Serves https://mta-sts.<domain>/.well-known/mta-sts.txt for
# every domain; the certificate must cover those names ([acme] adds them).
# Start with "testing" and switch to "enforce" once TLS reports show no
# failures. The _mta-sts TXT record to publish is printed at startup.
[mta_sts]
enabled = false
mode = "testing"                       # testing, enforce or none
max_age = 604800                       # seconds senders cache the policy
listen = ["0.0.0.0:443", "[::]:443"]

# Domains this server handles. Repeat the block for each domain.
[[domain]]
name = "example.org"
# Without a DKIM key (see below) idly refuses to start. Set this only if you
# really want this domain's mail sent unsigned (it will fail DMARC).
# allow_unsigned = true

# Accounts that may send mail through submission (587/465). An account may
# only send as its own address (MAIL FROM and the From header).
# Generate the hash with:  read -rs P; printf %s "$P" | idly user hash-password
#
# DKIM keys live in <data_dir>/dkim/<domain>/<selector>.key; create them with
#   idly dkim generate --domain example.org --selector 2026
# (an RSA and an Ed25519 key, so mail is dual-signed) and publish the TXT
# records it prints.
[[account]]
address = "alice@example.org"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$c2FsdHNhbHRzYWx0$REPLACEMEREPLACEMEREPLACEMEREPLACEME"

# Test mode: deliver ONLY to these domains, so a test setup cannot send mail
# to the internet by accident. Also enabled with `idly serve --test-mode`.
[test_mode]
enabled = false
allow_domains = []

# Daily SMTP TLS reports (RFC 8460): for each domain that publishes a
# _smtp._tls TXT record, a summary of the TLS results of the previous day's
# deliveries, sent a few hours after midnight UTC by email (DKIM-signed) or
# HTTPS. `from` is the contact address and the sender; its domain must be
# one of the [[domain]] entries and have a DKIM key.
[tls_reporting]
enabled = false
# from = "tlsrpt@example.org"
# organization = "Example Org"   # default: server.hostname

# Checks of the outside world, at startup and every 6 hours; they only warn
# (logs and the idly_outbound_port25_open / idly_reverse_dns_problems
# metrics). The PTR records of server.public_ips (or the detected address)
# must name server.hostname. The port-25 probe connects to these domains'
# MX, reads the banner and says QUIT, like a delivery would, to find out
# whether your provider blocks outbound mail.
[checks]
reverse_dns = true
port25_probe = true
probe_domains = ["gmail.com", "outlook.com", "yahoo.com"]

[log]
format = "json"   # or "text" for a terminal
level = "info"
